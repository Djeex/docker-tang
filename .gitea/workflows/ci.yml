name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Saturday 05:00 UTC: 06:00 in Paris in winter, 07:00 in summer (Gitea runs cron in UTC).
    - cron: "0 5 * * 6"
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get shared actions
        uses: actions/checkout@v7
        with:
          repository: labeex/cicdeex
          ref: 1.1.0
          token: ${{ secrets.CICDEEX_TOKEN }}
          path: .cicdeex
          persist-credentials: false

      - name: Scan for secrets
        uses: ./.cicdeex/secret-scan

      - name: Lint Dockerfile with hadolint
        uses: ./.cicdeex/hadolint

      - name: Build Docker image
        # --no-cache so `apk upgrade` really fetches the latest Alpine fixes:
        # the base is pinned by digest, a cached layer would never change.
        run: docker build --no-cache -t tang:ci .

      - name: Smoke test (syntax check)
        run: |
          docker run --rm --entrypoint sh tang:ci -c '
            for f in /usr/local/bin/docker-entrypoint /usr/local/bin/start-servers \
                     /usr/local/bin/check-servers /etc/docker-entrypoint.d/99-extra-scripts/*.sh; do
              sh -n "$f" || exit 1
            done
            tangd -v'

      - name: Run unit tests
        run: |
          docker build --target test -t tang:test .
          docker run --rm tang:test bats /app/tests

      - name: Lint shell scripts with shellcheck
        run: docker build --target lint -t tang:lint .

      - name: Compatibility test against padhihomelab/tang
        run: |
          docker build --target padhi-reference -t tang:padhi-reference .
          docker build --target clevis -t tang:clevis .
          bash tests/compat.sh tang:ci tang:padhi-reference tang:test tang:clevis

      - name: Scan with Trivy (critical - blocking)
        uses: ./.cicdeex/trivy
        with:
          image: tang:ci

      - name: Scan with Trivy (high - informative)
        uses: ./.cicdeex/trivy
        with:
          image: tang:ci
          severity: HIGH
          exit-code: "0"

      # Secrets are only used below, on main, never on pull requests (forks).
      - name: Publish tagged image
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        # Every value reaches the script through env: no secret is written into
        # the script, and no token goes on a command line or in a URL.
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Registry logins go to a temporary docker config, deleted at the end.
          # Only the logins and pushes use it: the rebuild keeps the default
          # config (and its CLI plugins).
          LOGIN_CONFIG=$(mktemp -d)
          trap 'rm -rf "$LOGIN_CONFIG"' EXIT

          IMAGE=git.djeex.fr/djeex/docker-tang
          GHCR_IMAGE=ghcr.io/djeex/docker-tang

          TANG_MAJOR=$(sed -n 's/^ARG TANG_VERSION=v\{0,1\}\([0-9]*\).*/\1/p' Dockerfile)
          TANG_TAG="tang${TANG_MAJOR}"
          TANG_DATED_TAG="${TANG_TAG}-$(date -u +%Y%m%d)"

          # Retag the already-built, already-tested, already-scanned image — never
          # rebuild for publish, so what ships is byte-for-byte what was checked.
          push_tags() {
            local DOCKER_CONFIG="$LOGIN_CONFIG"
            export DOCKER_CONFIG
            printf '%s\n' "$REGISTRY_TOKEN" | docker login git.djeex.fr -u Djeex --password-stdin
            printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u Djeex --password-stdin
            for REPO in "$IMAGE" "$GHCR_IMAGE"; do
              for TAG in "$@"; do
                docker tag tang:ci "$REPO:$TAG"
                docker push "$REPO:$TAG"
              done
            done
          }

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "Weekly rebuild: refreshing latest, $TANG_TAG and $TANG_DATED_TAG with the latest Alpine fixes."
            push_tags latest "$TANG_TAG" "$TANG_DATED_TAG"
            exit 0
          fi

          # BASE_REF empty = no previous state to diff against: every tracked file
          # counts as changed (VERSION included, so it is published as-is).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: publishing the current VERSION without bump."
            BASE_REF=$(git describe --tags --abbrev=0 2>/dev/null || true)
            CHANGED=$(git ls-files)
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push of the branch: treating every file as changed."
            BASE_REF=""
            CHANGED=$(git ls-files)
          else
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              BASE_REF="$BEFORE"
            else
              BASE_REF="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BASE_REF" "$SHA")
          fi
          echo "Changed files:"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -qE '^(Dockerfile|VERSION|[a-z-]+\.sh|entrypoint-scripts/.+)$'; then
            echo "No container-relevant file changed, skipping publish."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^VERSION$'; then
            echo "VERSION was manually edited in this push, using it as-is."
          else
            echo "VERSION untouched but container files changed, auto-bumping the build number (Z)."
            OLD_VERSION=$(tr -d '[:space:]' < VERSION)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "$NEW_VERSION" > VERSION

            git config user.name "docker-tang-ci"
            git config user.email "ci@git.djeex.fr"
            git add VERSION
            git commit -m "Bump build version to $NEW_VERSION [skip ci]"

            # Belt and suspenders: actions/checkout can leave its own ephemeral
            # credential injected as an extraheader, which would silently override
            # the credential below. persist-credentials:false on checkout
            # should already prevent this, but strip it here too just in case.
            git config --unset-all http.https://git.djeex.fr/.extraheader || true

            # One-shot credential helper: git reads the token from the
            # environment when asked, nothing is stored.
            # shellcheck disable=SC2016
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=Djeex; echo "password=${CI_PUSH_TOKEN}"; }; f' \
              push https://git.djeex.fr/Djeex/docker-tang.git HEAD:main

            # The image was built before the bump: rebuild from cache so the
            # banner shows the published version (only the VERSION layer changes).
            docker build -t tang:ci .
          fi

          VERSION=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MINOR_TAG="${MAJOR}.${MINOR}"

          push_tags latest "$MINOR_TAG" "$VERSION" "$TANG_TAG" "$TANG_DATED_TAG"

          TRIGGER_MSG=$(git log -1 --format=%s "$SHA")
          PR_NUM=$(echo "$TRIGGER_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)

          CATEGORY="🔧 Maintenance"
          CHANGE_TITLE="$TRIGGER_MSG"

          if [ -n "$PR_NUM" ]; then
            PR_JSON=$(printf 'header = "Authorization: token %s"\n' "$CI_PUSH_TOKEN" | curl -s -K - \
              "https://git.djeex.fr/api/v1/repos/Djeex/docker-tang/pulls/$PR_NUM")
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty' 2>/dev/null || true)
            LABELS=$(echo "$PR_JSON" | jq -r '.labels[]?.name' 2>/dev/null || true)

            if [ -n "$PR_TITLE" ]; then
              CHANGE_TITLE="$PR_TITLE"
            fi

            if echo "$LABELS" | grep -qx 'bug'; then
              CATEGORY="⚠️ Hotfix"
            elif echo "$LABELS" | grep -qx 'major'; then
              CATEGORY="💥 Breaking change"
            elif echo "$LABELS" | grep -qx 'minor'; then
              CATEGORY="✨ Update"
            fi
          fi

          REPO_URL="https://git.djeex.fr/Djeex/docker-tang"
          COMMIT_RANGE="$SHA"
          if [ -n "$BASE_REF" ]; then
            COMMIT_RANGE="$BASE_REF..$SHA"
          fi
          COMMIT_LIST=$(git log --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))" "$COMMIT_RANGE")

          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          SOURCE_LINE="[${SHORT_SHA}](${REPO_URL}/commit/${SHA})"
          if [ -n "$PR_NUM" ]; then
            SOURCE_LINE="[#${PR_NUM}](${REPO_URL}/pulls/${PR_NUM}) · ${SOURCE_LINE}"
          fi

          BODY=$(cat <<EOF
          ## Changelog

          ### ${CATEGORY}
          ${CHANGE_TITLE}

          **Source:** ${SOURCE_LINE}
          **Image:** \`${IMAGE}:${VERSION}\` (also \`${TANG_TAG}\`, \`${TANG_DATED_TAG}\`)

          **Commits:**
          ${COMMIT_LIST}
          EOF
          )

          JSON_PAYLOAD=$(jq -n \
            --arg tag "$VERSION" \
            --arg name "$VERSION" \
            --arg body "$BODY" \
            '{tag_name: $tag, name: $name, target_commitish: "main", body: $body}')

          printf 'header = "Authorization: token %s"\n' "$CI_PUSH_TOKEN" | curl -s -K - -o /dev/null -w "Release API response: %{http_code}\n" -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "https://git.djeex.fr/api/v1/repos/Djeex/docker-tang/releases"

          MIRROR_NOTICE="_This github repo is a mirror of https://git.djeex.fr/Djeex/docker-tang. You'll find full package, PR, history and release note there._"
          GH_BODY=$(printf '%s\n\n%s' "$MIRROR_NOTICE" "$BODY")

          GH_JSON_PAYLOAD=$(jq -n \
            --arg tag "$VERSION" \
            --arg name "$VERSION" \
            --arg body "$GH_BODY" \
            --arg sha "$SHA" \
            '{tag_name: $tag, name: $name, target_commitish: $sha, body: $body}')

          GH_STATUS=0
          for i in 1 2 3 4 5; do
            GH_STATUS=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -s -K - -o /tmp/gh_release.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$GH_JSON_PAYLOAD" \
              "https://api.github.com/repos/Djeex/docker-tang/releases")
            if [ "$GH_STATUS" = "201" ]; then
              break
            fi
            echo "GitHub Release attempt $i failed (HTTP $GH_STATUS) — mirror may not have synced this commit yet, retrying in 15s..."
            sleep 15
          done
          echo "GitHub Release API response: $GH_STATUS"
          if [ "$GH_STATUS" != "201" ]; then
            cat /tmp/gh_release.json 2>/dev/null || true
          fi

      - name: Notify failures
        if: always()
        uses: ./.cicdeex/notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
